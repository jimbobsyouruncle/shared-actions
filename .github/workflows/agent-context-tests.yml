name: Agent context tests

on:
  pull_request:
    paths:
      - 'agent-context/**'
      - '.github/workflows/agent-context-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'agent-context/**'
      - '.github/workflows/agent-context-tests.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run agent-context generator tests
        run: python3 -m unittest discover agent-context/tests
